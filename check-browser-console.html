<!DOCTYPE html>
<html>
<head>
    <title>Check Browser Errors</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .error { color: red; margin: 10px 0; padding: 10px; background: #ffe0e0; border-left: 4px solid red; }
        .success { color: green; margin: 10px 0; padding: 10px; background: #e0ffe0; border-left: 4px solid green; }
        .info { color: blue; margin: 10px 0; padding: 10px; background: #e0e0ff; border-left: 4px solid blue; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Browser Console Diagnostics</h1>
        
        <div id="output"></div>
        
        <script>
            const output = document.getElementById('output');
            
            // Clear any previous opacity settings
            document.documentElement.style.opacity = '1';
            
            function log(type, message) {
                const div = document.createElement('div');
                div.className = type;
                div.textContent = message;
                output.appendChild(div);
                console.log(`[${type.toUpperCase()}] ${message}`);
            }
            
            // Check for errors
            log('info', '📋 Dashboard Diagnostic Report');
            log('info', '================================');
            
            // 1. Check API object
            if (typeof API === 'undefined') {
                log('error', '❌ API object not defined');
            } else {
                log('success', '✅ API object exists');
                
                // Check token
                const token = API.getToken?.();
                if (token) {
                    log('success', '✅ JWT token found');
                    log('info', `   Token: ${token.substring(0, 20)}...`);
                } else {
                    log('info', 'ℹ️  No JWT token (not logged in - expected)');
                }
            }
            
            // 2. Check auth function
            if (typeof initAuth === 'undefined') {
                log('error', '❌ initAuth function not defined');
            } else {
                log('success', '✅ initAuth function exists');
            }
            
            // 3. Check localStorage
            log('info', '📦 Storage Items:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                if (key.includes('token') || key.includes('user')) {
                    log('info', `   ${key}: ${typeof value === 'string' ? value.substring(0, 30) + '...' : value}`);
                }
            }
            
            // 4. Redirect check
            log('info', '🌐 Current Page:');
            log('info', `   URL: ${window.location.href}`);
            log('info', `   Path: ${window.location.pathname}`);
            
            // 5. CSS check
            const cssLinks = document.querySelectorAll('link[rel="stylesheet"]');
            log('info', `📄 CSS Files: ${cssLinks.length} found`);
            
            // 6. Script check
            const scripts = document.querySelectorAll('script');
            log('info', `📜 Scripts: ${scripts.length} found`);
            
            // Window errors
            window.onerror = function(msg, url, lineNo, columnNo, error) {
                log('error', `⚠️  JavaScript Error: ${msg}`);
                log('error', `   at ${url}:${lineNo}:${columnNo}`);
                return false;
            };
            
            window.addEventListener('unhandledrejection', event => {
                log('error', `⚠️  Unhandled Promise Rejection: ${event.reason}`);
            });
            
            log('info', '================================');
            log('success', '✅ Diagnostics loaded. Check console (F12) for details.');
            
        </script>
    </div>
</body>
</html>
