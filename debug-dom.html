<!DOCTYPE html>
<html>
<head>
    <title>Debug DOM Elements</title>
</head>
<body>
    <h1>Dashboard DOM Debug</h1>
    <div id="debug-output"></div>
    
    <script>
        function checkElements() {
            const output = document.getElementById('debug-output');
            const results = [];

            // Check for key elements
            const elements = [
                'main-content',
                'archive-table',
                'archive-body',
                'dashboard-initial-loading',
                'empty-state',
                'pagination',
                'infinite-scroll-trigger',
                'archive-body'
            ];

            elements.forEach(id => {
                const el = document.getElementById(id);
                results.push(`${id}: ${el ? '✅ FOUND' : '❌ NOT FOUND'}`);
            });

            output.innerHTML = '<pre>' + results.join('\n') + '</pre>';
        }

        // Check immediately
        checkElements();

        // Check after a delay
        setTimeout(() => {
            const output = document.getElementById('debug-output');
            output.innerHTML += '<pre>---\nAfter 1000ms delay:\n</pre>';
            checkElements();
        }, 1000);

        // Load dashboard.html in an iframe to see its structure
        window.addEventListener('load', () => {
            const output = document.getElementById('debug-output');
            output.innerHTML += '<p><strong>Page fully loaded. Now checking structure...</strong></p>';
            checkElements();
        });
    </script>

    <iframe src="dashboard.html" style="width: 100%; height: 600px; border: 1px solid #ccc;"></iframe>
</body>
</html>
