<!DOCTYPE html>
<html>
<head>
    <title>Direct API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        pre { background: white; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; max-height: 300px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 14px; }
        #status { padding: 15px; background: #fffacd; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔌 Direct API Test</h1>
    
    <div id="status">Ready to test</div>
    
    <button onclick="testStorage()">1️⃣ Check LocalStorage</button>
    <button onclick="testAPI()">2️⃣ Test API Call</button>
    <button onclick="testAuth()">3️⃣ Test Auth</button>
    <button onclick="testDashboardElement()">4️⃣ Check Dashboard Element</button>
    <button onclick="clearAll()">🗑️ Clear All</button>

    <h2>Results:</h2>
    <div id="results"></div>

    <script>
        const BASE_URL = 'http://localhost:5000';

        function log(msg, type = 'info') {
            const results = document.getElementById('results');
            const status = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            
            let color = 'black';
            if (type === 'success') color = 'green';
            if (type === 'error') color = 'red';
            if (type === 'warning') color = 'orange';

            const line = `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${msg}</div>`;
            results.innerHTML += line;
            results.scrollTop = results.scrollHeight;
            
            status.textContent = msg;
            status.style.background = type === 'error' ? '#ffcccc' : type === 'success' ? '#ccffcc' : '#fffacd';
        }

        function clearAll() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').textContent = 'Cleared';
        }

        function testStorage() {
            log('📦 Checking LocalStorage...');
            
            const token = localStorage.getItem('jwt_token');
            const userData = localStorage.getItem('user_data');
            
            if (token) {
                log(`✅ JWT Token found (${token.substring(0, 20)}...)`, 'success');
                try {
                    const decoded = JSON.parse(atob(token.split('.')[1]));
                    log(`   User: ${decoded.email} (${decoded.role})`, 'success');
                } catch(e) {
                    log(`   Could not decode token: ${e.message}`, 'warning');
                }
            } else {
                log('❌ JWT Token NOT found', 'error');
            }

            if (userData) {
                log(`✅ User data found: ${userData.substring(0, 30)}...`, 'success');
            } else {
                log('❌ User data NOT found', 'error');
            }
        }

        async function testAuth() {
            log('🔐 Testing Auth API...');
            try {
                const response = await fetch(`${BASE_URL}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token') || '(no token)'}`
                    }
                });
                
                log(`Auth endpoint responded with status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                if (response.ok) {
                    log(`✅ Auth successful: ${data.email}`, 'success');
                } else {
                    log(`❌ Auth failed: ${data.error || data.message}`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function testAPI() {
            log('🌐 Testing API call...');
            try {
                const token = localStorage.getItem('jwt_token');
                if (!token) {
                    log('❌ No token found in localStorage', 'error');
                    return;
                }

                const response = await fetch(`${BASE_URL}/api/files?page=1&limit=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`API endpoint responded with status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                if (response.ok) {
                    log(`✅ API call successful`, 'success');
                    log(`   Files: ${data.files?.length || 0}`, 'success');
                    log(`   Total: ${data.total || 0}`, 'success');
                    log(`   Pages: ${data.totalPages || 0}`, 'success');
                } else {
                    log(`❌ API error: ${data.error || data.message}`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        function testDashboardElement() {
            log('🎨 Checking dashboard.html elements...');
            
            // Create a test div
            const testDiv = document.createElement('div');
            testDiv.innerHTML = `<tbody id="archive-body" style="display: contents;"></tbody>`;
            
            const element = testDiv.querySelector('[id="archive-body"]');
            if (element) {
                log('✅ Element selector works', 'success');
                log(`   Tag: ${element.tagName}`, 'success');
                log(`   ID: ${element.id}`, 'success');
                log(`   Display: ${element.style.display}`, 'success');
            } else {
                log('❌ Element selector FAILED', 'error');
            }

            // Test actual page
            try {
                const el = document.getElementById('archive-body');
                if (el) {
                    log('✅ archive-body found on THIS page', 'success');
                } else {
                    log('⚠️ archive-body NOT on this page (expected)', 'warning');
                }
            } catch(e) {
                log(`⚠️ Could not check: ${e.message}`, 'warning');
            }
        }

        // Run storage test on load
        window.addEventListener('load', () => {
            log('Page loaded - ready for testing');
            testStorage();
        });
    </script>
</body>
</html>
