<!DOCTYPE html>
<html>
<head>
    <title>Test Element Access</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        pre { background: white; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        h2 { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔍 Element Access Diagnostic</h1>
    
    <h2>Loading Dashboard...</h2>
    <iframe id="dashboard-frame" src="dashboard.html" style="width: 100%; height: 600px; border: 2px solid #ccc;"></iframe>
    
    <h2>Test Results:</h2>
    <div id="results"></div>

    <script>
        function runTests() {
            const results = document.getElementById('results');
            const tests = [];

            // Test 1: Check if elements exist in THIS page
            const archiveBody = document.getElementById('archive-body');
            tests.push(`
<span class="${archiveBody ? 'pass' : 'fail'}">Test 1 (this page)</span>: archive-body element = ${archiveBody ? '✅ FOUND' : '❌ NOT FOUND'}
            `);

            // Test 2: Try to access iframe content
            try {
                const frame = document.getElementById('dashboard-frame');
                if (frame && frame.contentDocument) {
                    const iframeBody = frame.contentDocument.getElementById('archive-body');
                    tests.push(`
<span class="${iframeBody ? 'pass' : 'fail'}">Test 2 (iframe)</span>: archive-body in iframe = ${iframeBody ? '✅ FOUND' : '❌ NOT FOUND'}
                    `);

                    if (iframeBody) {
                        tests.push(`
  └─ Parent: ${iframeBody.parentElement?.id || iframeBody.parentElement?.tagName}
  └─ Display: ${frame.contentWindow.getComputedStyle(iframeBody).display}
  └─ Children: ${iframeBody.children.length}
                        `);
                    }

                    // List all elements in iframe
                    const allElements = frame.contentDocument.querySelectorAll('[id]');
                    tests.push(`
<span class="pass">Test 3 (elements with ID in iframe)</span>: Found ${allElements.length} elements with ID:
${Array.from(allElements).slice(0, 15).map(e => `  - ${e.id}`).join('\n')}${allElements.length > 15 ? '\n  ... and more' : ''}
                    `);
                } else {
                    tests.push(`
<span class="fail">Test 2 (iframe)</span>: Cannot access iframe content (contentDocument is ${frame?.contentDocument})
                    `);
                }
            } catch (e) {
                tests.push(`
<span class="fail">Test 2 (iframe)</span>: Error accessing iframe: ${e.message}
                `);
            }

            results.innerHTML = '<pre>' + tests.join('\n') + '</pre>';
        }

        // Run tests after page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('Running diagnostic tests...');
                runTests();
            }, 2000);
        });

        // Also run after a delay
        setTimeout(() => {
            console.log('Running immediate tests...');
            runTests();
        }, 500);
    </script>
</body>
</html>
