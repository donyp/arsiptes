<!DOCTYPE html>
<html>
<head>
    <title>🔄 Full Reset - Clear Everything</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; }
        h1 { color: #333; }
        button { padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 0; width: 100%; }
        button:hover { background: #c0392b; }
        .success { color: green; font-weight: bold; }
        div { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 FULL RESET</h1>
        <p>Hapus semua cache dan reset ke fresh state</p>
        
        <button onclick="fullReset()">🗑️ RESET SEMUA (Clear Cache + Go to Dashboard)</button>
        
        <div id="status"></div>
    </div>

    <script>
        function fullReset() {
            const status = document.getElementById('status');
            status.innerHTML = '<p>Resetting...</p>';
            
            // Clear everything
            localStorage.clear();
            sessionStorage.clear();
            
            // Clear IndexedDB
            const dbNames = await indexedDB.databases();
            for (const db of dbNames) {
                indexedDB.deleteDatabase(db.name);
            }
            
            // Clear cookies
            document.cookie.split(";").forEach(c => {
                document.cookie = c
                    .replace(/^ +/, "")
                    .replace(/=.*/, `=;expires=${new Date().toUTCString()};path=/`);
            });
            
            status.innerHTML = '<p class="success">✅ SEMUA CACHE CLEARED!</p><p>Membuka dashboard fresh...</p>';
            
            // Hard refresh dashboard
            setTimeout(() => {
                window.location.href = 'http://localhost:5000/index.html?nocache=' + Date.now();
            }, 1000);
        }
    </script>
</body>
</html>
