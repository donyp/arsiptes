<!DOCTYPE html>
<html>
<head>
    <title>Verify Fix - Dashboard Rendering</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .dashboard-frame { width: 100%; height: 800px; border: 2px solid #333; border-radius: 8px; }
        .console { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .console-line { margin: 3px 0; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .warning { color: orange; font-weight: bold; }
        .info { color: blue; }
        h1 { color: #333; }
        .status { padding: 15px; background: white; border-radius: 8px; margin: 20px 0; }
        .status.loading { background: #fffacd; }
        .status.error { background: #ffcccc; }
        .status.success { background: #ccffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Fix Verification - Dashboard File List Rendering</h1>
        
        <div id="status" class="status loading">Checking and loading dashboard...</div>
        
        <h2>Dashboard Preview:</h2>
        <iframe id="dashboard" class="dashboard-frame" src="dashboard.html"></iframe>
        
        <h2>Console Output:</h2>
        <div class="console" id="console"></div>
    </div>

    <script>
        const consoleLogs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            consoleLogs.push({ message: logEntry, type });
            
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = logEntry;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }

        function setStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        // Initial log
        addLog('Verification script started', 'info');

        window.addEventListener('load', () => {
            addLog('Window loaded', 'info');
            
            setTimeout(() => {
                try {
                    const iframe = document.getElementById('dashboard');
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    addLog('Accessing iframe document...', 'info');
                    
                    // Check key elements
                    const archiveTable = iframeDoc.getElementById('archive-table');
                    const archiveBody = iframeDoc.getElementById('archive-body');
                    const mainContent = iframeDoc.getElementById('main-content');
                    
                    addLog(`✓ main-content found: ${!!mainContent}`, mainContent ? 'success' : 'error');
                    addLog(`✓ archive-table found: ${!!archiveTable}`, archiveTable ? 'success' : 'error');
                    addLog(`✓ archive-body found: ${!!archiveBody}`, archiveBody ? 'success' : 'error');
                    
                    if (archiveBody) {
                        addLog(`  └─ Tag: ${archiveBody.tagName}`, 'info');
                        addLog(`  └─ Children count: ${archiveBody.children.length}`, 'info');
                        addLog(`  └─ Text content length: ${archiveBody.textContent.length}`, 'info');
                        
                        if (archiveBody.children.length > 0) {
                            addLog('✅ File list items are being rendered!', 'success');
                            setStatus('✅ Fix appears to be working! Files are rendering.', 'success');
                        } else {
                            addLog('⚠️ archive-body exists but is empty', 'warning');
                            setStatus('⚠️ archive-body exists but no items yet (still loading?)', 'warning');
                        }
                    } else {
                        addLog('❌ archive-body element NOT FOUND', 'error');
                        setStatus('❌ Fix not working - archive-body element missing', 'error');
                    }
                    
                    // Check browser console for errors
                    addLog('---', 'info');
                    addLog('💡 Open browser DevTools (F12) in the iframe to see detailed logs', 'info');
                    
                } catch (e) {
                    addLog(`❌ Error checking elements: ${e.message}`, 'error');
                    setStatus('❌ Error occurred', 'error');
                }
            }, 3000); // Wait for dashboard to load
        });

        // Also try to capture console errors from iframe
        setInterval(() => {
            try {
                const iframe = document.getElementById('dashboard');
                if (iframe.contentWindow && iframe.contentWindow.console) {
                    // This is limited by CORS, but let's try
                }
            } catch(e) {
                // CORS restriction - expected
            }
        }, 1000);
    </script>
</body>
</html>
