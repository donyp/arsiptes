<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <link rel="stylesheet" href="css/style.css">

    <script>
        // Cloak the page until Auth and UI checks are done
        document.documentElement.style.opacity = '0';
        document.documentElement.classList.add('auth-loading');
    </script>
</head>

<body class="bg-[#F0F2F5] min-h-screen text-gray-800">

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <!-- Sidebar (rendered by js/sidebar.js?v=ULTRACLEAN_2026) -->
    <aside id="sidebar"
        class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40 hidden">
    </aside>

    <!-- Main Content -->
    <!-- Main Content (Default to 0 margin, will be set to ml-64 via JS if not admin_zona) -->
    <main id="main-content" class="min-h-screen transition-all duration-300">
        <header
            class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-gray-400 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Log Aktivitas Sistem</h2>
                    <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">CCTV riwayat pergerakan
                        Admin Zona dan akses data</p>
                </div>
            </div>
        </header>

        <div class="p-6 pb-24">
            <div
                class="bg-white rounded-[2rem] overflow-hidden border border-gray-100 flex flex-col min-h-[60vh] shadow-xl shadow-blue-500/5">
                <div class="overflow-x-auto min-h-[400px]">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead>
                            <tr
                                class="border-b border-gray-100 bg-gray-50/50 text-[10px] uppercase font-bold tracking-widest text-gray-400">
                                <th class="pl-8 py-5 font-bold w-1/4">User</th>
                                <th class="py-5 font-bold w-1/6">Aksi</th>
                                <th class="py-5 font-bold w-1/3">Konteks</th>
                                <th class="pr-8 py-5 font-bold w-1/4">Waktu</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm divide-y divide-gray-50">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer Pagination -->
                <div id="pagination"
                    class="hidden mt-auto border-t border-gray-100 p-6 flex items-center justify-between bg-gray-50/30">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest" id="page-info">Halaman 1 dari 1
                    </p>
                    <div class="flex gap-2">
                        <button id="btn-prev" onclick="changePage(-1)"
                            class="p-2.5 rounded-xl bg-white border border-gray-200 text-gray-400 hover:text-blue-600 hover:border-blue-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <button id="btn-next" onclick="changePage(1)"
                            class="p-2.5 rounded-xl bg-white border border-gray-200 text-gray-400 hover:text-blue-600 hover:border-blue-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center py-20">
                    <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-6">
                        <svg class="w-10 h-10 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <h3 class="text-gray-900 font-extrabold text-lg">Tidak ada log aktivitas</h3>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="flex-1 flex items-center justify-center py-20 hidden">
                    <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/sidebar.js?v=ULTRACLEAN_2026"></script>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    </script>
</body>

</html>
