<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kesehatan Sistem | Pusat Arsip Anka</title><link rel="stylesheet" href="css/tailwind.generated.css"><link rel="stylesheet" href="css/style.css"><script>document.documentElement.style.opacity='0';document.documentElement.classList.add('auth-loading');</script></head>
<body class="bg-[#F0F2F5] min-h-screen text-gray-800">
<div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div><aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40 hidden"></aside>
<main id="main-content" class="min-h-screen"><header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-5"><h1 class="text-xl font-black text-gray-900">Kesehatan Sistem</h1><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Status layanan dan storage</p></header><section class="p-6 max-w-5xl mx-auto space-y-6"><div id="health-overview"></div><div id="health-grid" class="grid md:grid-cols-2 gap-4"></div><p id="health-time" class="text-[10px] text-gray-400"></p></section></main>
<script src="js/sidebar.js?v=ULTRACLEAN_2026"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script>
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('mobile-overlay')?.classList.toggle('active');}
let healthRequest = null;
function healthButtonMarkup(disabled = false) {
    return `<button id="health-recheck" type="button" ${disabled ? 'disabled' : ''} onclick="loadHealth()" class="px-4 py-2 rounded-xl bg-gray-900 text-white text-[10px] font-black uppercase disabled:opacity-50 disabled:cursor-wait">${disabled ? 'Memeriksa...' : 'Periksa ulang'}</button>`;
}
function renderHealthError(message) {
    document.getElementById('health-overview').innerHTML = `<div class="bg-white rounded-3xl border border-red-100 p-6 shadow-sm flex items-center justify-between gap-4"><div><p class="text-[10px] font-black uppercase tracking-widest text-red-400">Pemeriksaan gagal</p><h2 class="text-xl font-black mt-2 text-red-600">${message || 'Tidak dapat memeriksa kesehatan sistem.'}</h2></div>${healthButtonMarkup()}</div>`;
    document.getElementById('health-grid').innerHTML = '';
}
async function loadHealth() {
    if (healthRequest) return healthRequest;
    const overview = document.getElementById('health-overview');
    if (overview) overview.innerHTML = `<div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm flex items-center justify-between">${healthButtonMarkup(true)}<p class="text-xs text-gray-500">Menghubungi layanan sistem...</p></div>`;
    healthRequest = (async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
            const data = await API.request('/api/system/health', { method: 'GET', signal: controller.signal });
            document.getElementById('health-overview').innerHTML = `<div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm flex items-center justify-between"><div><p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Status keseluruhan</p><h2 class="text-3xl font-black mt-2 ${data.healthy ? 'text-emerald-600' : 'text-amber-600'}">${data.healthy ? 'Sehat' : 'Perlu perhatian'}</h2></div>${healthButtonMarkup()}</div>`;
            document.getElementById('health-grid').innerHTML = Object.entries(data.services || {}).map(([name, item]) => `<div class="bg-white rounded-2xl border border-gray-100 p-5 flex items-start gap-4"><span class="w-3 h-3 rounded-full mt-1 ${item.healthy ? 'bg-emerald-500' : 'bg-red-500'}"></span><div><h3 class="font-black capitalize text-gray-900">${name}</h3><p class="text-xs text-gray-500 mt-1">${item.detail || '-'}</p></div></div>`).join('');
            document.getElementById('health-time').textContent = 'Diperiksa: ' + new Date(data.checkedAt).toLocaleString('id-ID');
        } catch (err) {
            const message = err.name === 'AbortError' ? 'Pemeriksaan melebihi batas waktu.' : err.message;
            renderHealthError(message);
            Toast.error(message);
        } finally {
            clearTimeout(timeout);
            healthRequest = null;
        }
    })();
    return healthRequest;
}
document.addEventListener('DOMContentLoaded',async()=>{if(await initAuth(['super_admin','moderator']))loadHealth();});
</script></body></html>
