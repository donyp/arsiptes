<!DOCTYPE html>
<html>
<head>
    <title>Comprehensive Dashboard Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .header p { color: #666; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 { font-size: 16px; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .test-item {
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            background: #f5f5f5;
            border-left: 4px solid #ccc;
        }
        .test-item.pass { background: #e8f5e9; border-left-color: #4caf50; }
        .test-item.fail { background: #ffebee; border-left-color: #f44336; }
        .test-item.warning { background: #fff3e0; border-left-color: #ff9800; }
        .test-item.info { background: #e3f2fd; border-left-color: #2196f3; }
        .label { font-weight: 600; color: #333; }
        .value { color: #666; font-size: 14px; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .dashboard-preview {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .dashboard-preview iframe {
            width: 100%;
            height: 700px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        .status-badge.success { background: #4caf50; color: white; }
        .status-badge.error { background: #f44336; color: white; }
        .status-badge.warning { background: #ff9800; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Comprehensive Dashboard Test Suite</h1>
            <p>Testing the file list rendering fix</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📋 Pre-Flight Checks</h2>
                <div id="preflight"></div>
                <div class="button-group">
                    <button class="btn-primary" onclick="runPreflightChecks()">Run Checks</button>
                </div>
            </div>

            <div class="card">
                <h2>🔌 API Tests</h2>
                <div id="api-tests"></div>
                <div class="button-group">
                    <button class="btn-primary" onclick="testAPIConnectivity()">Test API</button>
                    <button class="btn-secondary" onclick="testAPIFiles()">Test Files Endpoint</button>
                </div>
            </div>

            <div class="card">
                <h2>🎨 DOM Tests</h2>
                <div id="dom-tests"></div>
                <div class="button-group">
                    <button class="btn-primary" onclick="testDOMElements()">Check DOM</button>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ Debug Info</h2>
                <div id="debug-info"></div>
                <div class="button-group">
                    <button class="btn-secondary" onclick="showEnvironment()">Show Environment</button>
                    <button class="btn-secondary" onclick="clearLogs()">Clear Logs</button>
                </div>
            </div>
        </div>

        <div class="dashboard-preview">
            <h2 style="margin-bottom: 15px;">📊 Live Dashboard Preview</h2>
            <iframe id="dashboard-frame" src="dashboard.html"></iframe>
        </div>
    </div>

    <script>
        let testResults = [];

        function addResult(title, status, details = '') {
            testResults.push({ title, status, details });
        }

        function addTest(elementId, title, status, details = '') {
            const container = document.getElementById(elementId);
            const item = document.createElement('div');
            item.className = `test-item ${status}`;
            item.innerHTML = `
                <span class="label">${title}</span>
                ${details ? `<br><span class="value">${details}</span>` : ''}
            `;
            container.appendChild(item);
        }

        function clearContainer(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        async function runPreflightChecks() {
            clearContainer('preflight');
            
            // Check localStorage
            const token = localStorage.getItem('jwt_token');
            const userData = localStorage.getItem('user_data');
            
            addTest('preflight', 'JWT Token', token ? 'pass' : 'fail', 
                token ? `Present (${token.substring(0, 15)}...)` : 'Missing');
            
            addTest('preflight', 'User Data', userData ? 'pass' : 'fail',
                userData ? 'Present' : 'Missing - you may not be logged in');
            
            // Check browser capabilities
            addTest('preflight', 'localStorage', typeof localStorage !== 'undefined' ? 'pass' : 'fail',
                'Available');
            
            addTest('preflight', 'fetch API', typeof fetch !== 'undefined' ? 'pass' : 'fail',
                'Available');
            
            // Check page readiness
            addTest('preflight', 'DOM Ready', document.readyState === 'complete' ? 'pass' : 'warning',
                `State: ${document.readyState}`);
        }

        async function testAPIConnectivity() {
            clearContainer('api-tests');
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token') || '(no token)'}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addTest('api-tests', 'API Connectivity', 'pass',
                        `Connected as: ${data.email} (${data.role})`);
                } else {
                    addTest('api-tests', 'API Connectivity', 'fail',
                        `Status: ${response.status} - ${await response.text()}`);
                }
            } catch (e) {
                addTest('api-tests', 'API Connectivity', 'fail',
                    `Error: ${e.message}`);
            }
        }

        async function testAPIFiles() {
            clearContainer('api-tests');
            
            try {
                const token = localStorage.getItem('jwt_token');
                if (!token) {
                    addTest('api-tests', 'Files Endpoint', 'fail', 'No JWT token');
                    return;
                }

                const response = await fetch('http://localhost:5000/api/files?page=1&limit=5', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addTest('api-tests', 'Files Endpoint', 'pass',
                        `Returned ${data.files?.length || 0} files, Total: ${data.total || 0}`);
                } else {
                    addTest('api-tests', 'Files Endpoint', 'fail',
                        `Error: ${data.error || data.message || response.status}`);
                }
            } catch (e) {
                addTest('api-tests', 'Files Endpoint', 'fail',
                    `Error: ${e.message}`);
            }
        }

        function testDOMElements() {
            clearContainer('dom-tests');
            
            try {
                const frame = document.getElementById('dashboard-frame');
                if (!frame.contentDocument) {
                    addTest('dom-tests', 'Iframe Access', 'fail', 'Cannot access iframe document');
                    return;
                }

                const doc = frame.contentDocument;
                
                const mainContent = doc.getElementById('main-content');
                const archiveTable = doc.getElementById('archive-table');
                const archiveBody = doc.getElementById('archive-body');
                
                addTest('dom-tests', 'main-content Element', mainContent ? 'pass' : 'fail',
                    mainContent ? `Found (${mainContent.tagName})` : 'Not found');
                
                addTest('dom-tests', 'archive-table Element', archiveTable ? 'pass' : 'fail',
                    archiveTable ? `Found (${archiveTable.tagName})` : 'Not found');
                
                addTest('dom-tests', 'archive-body Element', archiveBody ? 'pass' : 'fail',
                    archiveBody ? `Found (${archiveBody.tagName}), Children: ${archiveBody.children.length}` : 'Not found');
                
                if (archiveBody && archiveBody.children.length > 0) {
                    addTest('dom-tests', 'File Items Rendering', 'pass',
                        `${archiveBody.children.length} file items rendered`);
                } else if (archiveBody) {
                    addTest('dom-tests', 'File Items Rendering', 'warning',
                        'Element exists but no items yet (still loading?)');
                }
                
            } catch (e) {
                addTest('dom-tests', 'DOM Test Error', 'fail',
                    `Error: ${e.message}`);
            }
        }

        function showEnvironment() {
            clearContainer('debug-info');
            
            addTest('debug-info', 'Browser', 'info', navigator.userAgent.substring(0, 50) + '...');
            addTest('debug-info', 'Current URL', 'info', window.location.href.substring(0, 40) + '...');
            addTest('debug-info', 'Timestamp', 'info', new Date().toLocaleString());
            addTest('debug-info', 'Console Available', 'info', typeof console !== 'undefined' ? 'Yes' : 'No');
        }

        function clearLogs() {
            testResults = [];
            document.getElementById('preflight').innerHTML = '';
            document.getElementById('api-tests').innerHTML = '';
            document.getElementById('dom-tests').innerHTML = '';
            document.getElementById('debug-info').innerHTML = '';
        }

        // Auto-run checks on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                runPreflightChecks();
                showEnvironment();
            }, 500);
        });
    </script>
</body>
</html>
