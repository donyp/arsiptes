<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Backup Metadata | Pusat Arsip Anka</title><link rel="stylesheet" href="css/tailwind.generated.css"><link rel="stylesheet" href="css/style.css"><script>document.documentElement.style.opacity='0';document.documentElement.classList.add('auth-loading');</script></head>
<body class="bg-[#F0F2F5] min-h-screen text-gray-800">
<div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div><aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40 hidden"></aside>
<main id="main-content" class="min-h-screen"><header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-5 flex items-center justify-between"><div><h1 class="text-xl font-black text-gray-900">Backup Metadata</h1><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Snapshot database dan salinan storage</p></div><button onclick="createBackup()" class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-[10px] font-black uppercase tracking-widest hover:bg-blue-700">Buat Backup</button></header><section class="p-6 max-w-5xl mx-auto"><div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden"><div class="p-6 border-b border-gray-100 flex items-center justify-between"><div><h2 class="font-black text-gray-900">Riwayat Backup</h2><p class="text-xs text-gray-400 mt-1">Backup lokal juga dikirim ke storage cadangan jika tersedia.</p></div><button onclick="loadBackups()" class="text-[10px] font-black uppercase tracking-widest text-blue-600">Refresh</button></div><div id="backup-list" class="divide-y divide-gray-50"></div></div></section></main>
<script src="js/sidebar.js?v=ULTRACLEAN_2026"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script>
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('mobile-overlay')?.classList.toggle('active');}
async function loadBackups(){try{const data=await API.get('/api/system/backups');const list=data.backups||[];document.getElementById('backup-list').innerHTML=list.length?list.map(item=>`<div class="p-5 flex items-center justify-between gap-4"><div><p class="font-bold text-sm text-gray-900">${item.name}</p><p class="text-[10px] text-gray-400 mt-1">${new Date(item.createdAt).toLocaleString('id-ID')}</p></div><div class="flex items-center gap-3"><span class="text-xs font-bold text-gray-500">${(item.size/1024).toFixed(1)} KB</span><button type="button" data-backup-name="${item.name}" class="backup-download px-3 py-2 rounded-lg bg-gray-900 text-white text-[10px] font-black uppercase">Download</button></div></div>`).join(''):'<div class="p-16 text-center text-sm text-gray-400">Belum ada backup metadata.</div>';document.querySelectorAll('.backup-download').forEach(button=>button.addEventListener('click',()=>downloadBackup(button.dataset.backupName)));}catch(err){Toast.error(err.message);}}
async function downloadBackup(name){try{const safeName=encodeURIComponent(name);const response=await API.request('/api/system/backups/'+safeName+'/download',{method:'GET',rawResponse:true});const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(err){Toast.error(err.message);}}
async function createBackup(){try{const result=await API.post('/api/system/backups',{});Toast.success(`Backup ${result.backup.name} berhasil dibuat.`);loadBackups();}catch(err){Toast.error(err.message);}}
document.addEventListener('DOMContentLoaded',async()=>{if(await initAuth(['super_admin','moderator']))loadBackups();});
</script></body></html>
