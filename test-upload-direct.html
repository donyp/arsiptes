<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .status { margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .error { background-color: #ffcccc; color: #cc0000; }
        .success { background-color: #ccffcc; color: #00cc00; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Web File Upload</h1>
    
    <div>
        <h3>Login First</h3>
        <button onclick="login()">Login as arsip@anka.id</button>
    </div>
    
    <div id="uploadSection" style="display: none; margin-top: 30px;">
        <h3>Upload Test File</h3>
        <button onclick="uploadTestFile()">Upload Test PDF</button>
    </div>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <script>
        const API_URL = 'http://localhost:5000';
        let token = null;
        
        async function login() {
            try {
                updateStatus('Logging in...', '');
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'arsip@anka.id',
                        password: 'Sukarman123!'
                    })
                });
                
                if (!res.ok) throw new Error(`Login failed: ${res.status}`);
                const data = await res.json();
                token = data.token;
                updateStatus('Login successful!', 'success');
                document.getElementById('uploadSection').style.display = 'block';
            } catch (err) {
                updateStatus(`Login failed: ${err.message}`, 'error');
            }
        }
        
        function updateStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
        
        async function uploadTestFile() {
            try {
                if (!token) {
                    updateStatus('Please login first', 'error');
                    return;
                }
                
                updateStatus('Creating test PDF...', '');
                
                // Create a simple test PDF
                const pdfContent = `%PDF-1.1
%âãÏÓ
1 0 obj
<< /Type /Catalog /Pages 2 0 R >>
endobj
2 0 obj
<< /Type /Pages /Kids [3 0 R] /Count 1 >>
endobj
3 0 obj
<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >>
endobj
4 0 obj
<< /Length 44 >>
stream
BT
/F1 12 Tf
50 750 Td
(Test Upload) Tj
ET
endstream
endobj
xref
0 5
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000214 00000 n

<< /Size 5 /Root 1 0 R >>
startxref
308
%%EOF`;
                
                const blob = new Blob([pdfContent], { type: 'application/pdf' });
                const formData = new FormData();
                formData.append('file', blob, 'NON Balaraja 2.500.000 26 Aug.pdf');
                formData.append('zona_id', '1');
                formData.append('toko_id', '1');
                formData.append('category', 'INVOICE');
                formData.append('tanggal_dokumen', '2026-08-26');
                formData.append('total_jual', '2500000');
                formData.append('tipe_ppn', 'NON');
                
                updateStatus('Uploading file...', '');
                
                const uploadRes = await fetch(`${API_URL}/api/files/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!uploadRes.ok) {
                    const error = await uploadRes.text();
                    throw new Error(`Upload failed: ${uploadRes.status} - ${error}`);
                }
                
                const result = await uploadRes.json();
                updateStatus(`Upload successful! Storage path: ${result.file.storage_path}`, 'success');
                console.log('Uploaded file:', result.file);
            } catch (err) {
                updateStatus(`Error: ${err.message}`, 'error');
                console.error('Upload error:', err);
            }
        }
    </script>
</body>
</html>
