<!DOCTYPE html>
<html>
<head>
    <title>Test File List</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #4CAF50; color: white; }
        tr:hover { background: #f9f9f9; }
        .error { color: red; padding: 10px; background: #ffebee; border-radius: 4px; }
        .success { color: green; padding: 10px; background: #e8f5e9; border-radius: 4px; }
        .loading { color: orange; padding: 10px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #45a049; }
        .stats { background: #e3f2fd; padding: 15px; margin: 20px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Test File List dari Database</h1>
        
        <div style="margin: 20px 0;">
            <button onclick="getFileList()">🔄 Reload File List</button>
            <button onclick="getWithToken()">🔐 Test dengan Token</button>
            <button onclick="checkBackend()">✅ Check Backend</button>
        </div>

        <div id="status" class="loading" style="display:none;"></div>
        <div id="stats" class="stats" style="display:none;"></div>
        
        <h2>Files dari Database:</h2>
        <div id="loading" class="loading">Loading...</div>
        <table id="filesTable" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Filename</th>
                    <th>Zona</th>
                    <th>Toko</th>
                    <th>Category</th>
                    <th>Size (KB)</th>
                    <th>Upload Date</th>
                </tr>
            </thead>
            <tbody id="filesBody"></tbody>
        </table>
        
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script>
        function checkBackend() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = 'Checking backend...';
            
            fetch('http://localhost:5000/api/heartbeat')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').className = 'success';
                    document.getElementById('status').textContent = '✅ Backend OK: ' + JSON.stringify(data);
                })
                .catch(e => {
                    document.getElementById('status').className = 'error';
                    document.getElementById('status').textContent = '❌ Backend Error: ' + e.message;
                });
        }

        function getWithToken() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('filesTable').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            // Try login first
            const loginData = {
                email: 'admin@arsipanka.com',
                password: 'admin123'
            };
            
            fetch('http://localhost:5000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            })
            .then(r => r.json())
            .then(data => {
                if (data.token) {
                    console.log('✅ Login success, token:', data.token);
                    // Now get files with token
                    return fetch('http://localhost:5000/api/files', {
                        headers: { 'Authorization': 'Bearer ' + data.token }
                    }).then(r => r.json());
                } else {
                    throw new Error('Login failed: ' + JSON.stringify(data));
                }
            })
            .then(files => {
                displayFiles(files);
                document.getElementById('loading').style.display = 'none';
            })
            .catch(e => {
                console.error('Error:', e);
                showError('❌ Error with token: ' + e.message);
            });
        }

        function getFileList() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('filesTable').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            
            // Try multiple endpoints
            console.log('Attempting to get files...');
            
            Promise.all([
                fetch('http://localhost:5000/api/files').then(r => r.json()).catch(e => ({ error: e.message })),
                fetch('http://localhost:5000/api/health/storage').then(r => r.json()).catch(e => ({ error: e.message }))
            ])
            .then(([filesData, storageData]) => {
                console.log('Files response:', filesData);
                console.log('Storage response:', storageData);
                
                // Display storage info
                if (storageData.healthy) {
                    const stats = document.getElementById('stats');
                    stats.style.display = 'block';
                    stats.innerHTML = `
                        <strong>Storage Status:</strong> ${storageData.status}<br>
                        <strong>Method:</strong> ${storageData.method}<br>
                        <strong>Message:</strong> ${storageData.message}
                    `;
                }
                
                if (filesData.error) {
                    throw new Error('Files endpoint: ' + filesData.error);
                }
                
                if (Array.isArray(filesData)) {
                    displayFiles(filesData);
                } else if (filesData.data) {
                    displayFiles(filesData.data);
                } else {
                    throw new Error('Unexpected response format: ' + JSON.stringify(filesData).substring(0, 100));
                }
                
                document.getElementById('loading').style.display = 'none';
            })
            .catch(e => {
                console.error('Error:', e);
                showError('❌ Error fetching files: ' + e.message);
            });
        }

        function displayFiles(files) {
            const tbody = document.getElementById('filesBody');
            tbody.innerHTML = '';
            
            if (!files || files.length === 0) {
                showError('⚠️ Tidak ada files di database');
                return;
            }
            
            files.forEach(file => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${file.id ? file.id.substring(0, 8) : '-'}</td>
                    <td>${file.filename || file.original_name || '-'}</td>
                    <td>${file.zona_kode || '-'}</td>
                    <td>${file.toko_kode || '-'}</td>
                    <td>${file.category || '-'}</td>
                    <td>${file.file_size ? (file.file_size / 1024).toFixed(2) : '-'}</td>
                    <td>${file.upload_date ? new Date(file.upload_date).toLocaleString() : '-'}</td>
                `;
            });
            
            document.getElementById('filesTable').style.display = 'table';
            
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.className = 'success';
            status.textContent = `✅ Loaded ${files.length} files from database`;
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('filesTable').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = msg;
        }

        // Load files on page load
        window.onload = function() {
            checkBackend();
            setTimeout(() => getFileList(), 1000);
        };
    </script>
</body>
</html>
